<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="590" viewBox="0 0 1320 590" role="img" aria-labelledby="title desc"><title id="title">Bark Bridge 提醒示意</title><desc id="desc">电脑上的任务继续运行，在需要授权、回答或本轮完成时，通过Bark服务向iPhone发送提醒。以下为示意文案，非实机截图。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122638"/><stop offset="1" stop-color="#0c1628"/></linearGradient><radialGradient id="glow"><stop stop-color="#479cde" stop-opacity=".24"/><stop offset="1" stop-color="#479cde" stop-opacity="0"/></radialGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Hiragino Sans GB,sans-serif"><rect width="1320" height="590" rx="30" fill="url(#bg)"/><circle cx="1010" cy="280" r="430" fill="url(#glow)"/><path d="M704 126v390" stroke="#324358" stroke-dasharray="4 8"/><text x="64" y="75" font-size="16" fill="#93b3d4" font-weight="600" letter-spacing="2">BARK BRIDGE  /  MAC → IPHONE</text><text x="64" y="175" font-size="54" fill="#fff" font-weight="700" >电脑继续忙。</text><text x="64" y="248" font-size="54" fill="#fff" font-weight="700" >需要你时，</text><text x="64" y="320" font-size="54" fill="#8edfd2" font-weight="700" >手机告诉你。</text><text x="66" y="382" font-size="22" fill="#bdccdd" font-weight="400" >授权 · 提问 · 本轮完成</text><rect x="64" y="420" width="206" height="42" rx="21" fill="#22394d" stroke="#41627a"/><text x="86" y="447" font-size="16" fill="#d9e8f7" font-weight="500" >一次配置，换号沿用</text><text x="66" y="537" font-size="16" fill="#8fa8c2" font-weight="400" >原生菜单栏 · 多设备 · 每日勿扰</text><g transform="translate(756 93)"><rect width="480" height="112" rx="22" fill="#172a42" stroke="#344962"/><rect x="20" y="22" width="5" height="65" rx="2.5" fill="#efc38c"/><text x="42" y="37" font-size="15" fill="#efc38c" font-weight="600" >01  需要你的决定</text><text x="42" y="66" font-size="22" fill="#fff" font-weight="600" >示例聊天 · 等待授权</text><text x="42" y="92" font-size="16" fill="#bfccdc" font-weight="400" >工具：终端。请返回 Mac 查看并决定。</text><circle cx="453" cy="30" r="4" fill="#efc38c"/></g><g transform="translate(778 225)"><rect width="480" height="112" rx="22" fill="#172a42" stroke="#344962"/><rect x="20" y="22" width="5" height="65" rx="2.5" fill="#8edfd2"/><text x="42" y="37" font-size="15" fill="#8edfd2" font-weight="600" >02  需要你的回答</text><text x="42" y="66" font-size="22" fill="#fff" font-weight="600" >示例聊天 · 等待回答</text><text x="42" y="92" font-size="16" fill="#bfccdc" font-weight="400" >使用哪种方案？  1. 方案 A   2. 方案 B</text><circle cx="453" cy="30" r="4" fill="#8edfd2"/></g><g transform="translate(756 357)"><rect width="480" height="112" rx="22" fill="#172a42" stroke="#344962"/><rect x="20" y="22" width="5" height="65" rx="2.5" fill="#a8bbff"/><text x="42" y="37" font-size="15" fill="#a8bbff" font-weight="600" >03  有新的结果</text><text x="42" y="66" font-size="22" fill="#fff" font-weight="600" >示例聊天 · 本轮已完成</text><text x="42" y="92" font-size="16" fill="#bfccdc" font-weight="400" >本轮回复已结束，可返回 Mac 查看结果。</text><circle cx="453" cy="30" r="4" fill="#a8bbff"/></g><text x="756" y="527" font-size="16" fill="#9cb0c8" font-weight="400" >示意文案，非实机截图。手机查看提醒，Mac 回答与审批。</text></g></svg>